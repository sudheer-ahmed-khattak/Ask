<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Ask Sudheer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Ask anything about Sudheer Ahmed Khattak – Senior Executive Assistant and Logistics & Operations professional.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one centred conversation column — profile header, suggested questions, chat thread, composer pinned at the bottom */
:root{
  --bg:#f4f1ea; --panel:#fffdf8; --ink:#13213a; --mut:#5d6779; --line:#e3dccb;
  --gold:#b88a1c; --gold2:#d9b45a; --teal:#11847a; --me:#13213a; --mefg:#fdf8ec;
  --bot:#ffffff; --chip:#fbf6ea; --shadow:0 10px 30px rgba(19,33,58,.08);
  --fd:"Fraunces",Georgia,"Times New Roman",serif; --fb:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#081221; --panel:#0e1b30; --ink:#eef2f8; --mut:#9fb0c7; --line:#1f3150;
  --gold:#d9b45a; --gold2:#f2d27a; --teal:#38c9b9; --me:#d9b45a; --mefg:#0a1526;
  --bot:#122441; --chip:#11223d; --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#081221; --panel:#0e1b30; --ink:#eef2f8; --mut:#9fb0c7; --line:#1f3150;
  --gold:#d9b45a; --gold2:#f2d27a; --teal:#38c9b9; --me:#d9b45a; --mefg:#0a1526;
  --bot:#122441; --chip:#11223d; --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.55}
.app{max-width:760px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{padding-block:28px 18px;display:flex;gap:18px;align-items:center;border-bottom:1px solid var(--line)}
.ph{width:76px;height:76px;border-radius:50%;flex:none;padding:3px;background:conic-gradient(var(--gold),var(--gold2),var(--teal),var(--gold))}
.ph img{width:100%;height:100%;border-radius:50%;display:block;object-fit:cover;border:2px solid var(--bg)}
.who{min-width:0}
.who h1{font-family:var(--fd);font-weight:700;font-size:clamp(1.45rem,4.5vw,1.9rem);margin:0;line-height:1.15;text-wrap:balance}
.who p{margin:4px 0 0;color:var(--mut);font-size:.93rem}
.who p b{color:var(--gold);font-weight:700}
.status{display:inline-flex;align-items:center;gap:7px;margin-top:8px;font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--teal)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 4px color-mix(in srgb,var(--teal) 22%,transparent)}
.thread{flex:1;padding-block:22px 12px;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:10px;align-items:flex-end;max-width:100%}
.msg .av{width:30px;height:30px;border-radius:50%;flex:none;overflow:hidden;border:1.5px solid var(--gold)}
.msg .av img{width:100%;height:100%;object-fit:cover;display:block}
.bub{background:var(--bot);border:1px solid var(--line);border-radius:18px 18px 18px 6px;padding:12px 16px;box-shadow:var(--shadow);min-width:0;max-width:min(560px,85%)}
.bub p{margin:0 0 8px}.bub p:last-child{margin:0}
.bub ul{margin:6px 0 4px;padding-left:20px}.bub li{margin:3px 0}
.bub b{color:var(--ink)} .bub .k{color:var(--gold);font-weight:700}
.me{justify-content:flex-end}
.me .bub{background:var(--me);color:var(--mefg);border-color:transparent;border-radius:18px 18px 6px 18px;box-shadow:none}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.links a,.links button{font:inherit;font-size:.85rem;font-weight:700;text-decoration:none;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.links a:hover,.links button:hover{border-color:var(--gold)}
.typing{display:inline-flex;gap:5px;padding:4px 2px}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--mut);animation:b 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.sugg{display:flex;flex-wrap:wrap;gap:8px;padding-block:4px 10px}
@media (max-width:640px){.sugg{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)))}.sugg::-webkit-scrollbar{display:none}.sugg button{flex:none}}
.sugg button{font:inherit;font-size:.88rem;font-weight:600;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;transition:border-color .15s,transform .15s}
.sugg button:hover{border-color:var(--gold);transform:translateY(-1px)}
.sugg button:focus-visible,.links a:focus-visible,.links button:focus-visible,#send:focus-visible,#q:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.composer{position:sticky;bottom:0;padding-block:12px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.lbl{font-size:.75rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:0 0 8px}
form{display:flex;gap:10px;background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:6px 6px 6px 16px;box-shadow:var(--shadow)}
form:focus-within{border-color:var(--gold)}
#q{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:1rem;outline:none}
#send{border:0;border-radius:12px;background:var(--gold);color:#0a1526;font:inherit;font-weight:800;padding:10px 18px;cursor:pointer}
.foot{font-size:.78rem;color:var(--mut);text-align:center;margin-top:10px}
@media (prefers-reduced-motion:reduce){.typing span{animation:none}.sugg button{transition:none}}
</style>

<div class="app">
  <header>
    <div class="ph"><img id="pic" alt="Sudheer Ahmed Khattak"></div>
    <div class="who">
      <h1>Ask Sudheer</h1>
      <p><b>Senior Executive Assistant</b> · Lead Administrative Specialist, Logistics &amp; Operations</p>
      <span class="status"><i></i>Replies instantly</span>
    </div>
  </header>

  <main class="thread" id="thread" aria-live="polite"></main>

  <div class="composer">
    <p class="lbl">Popular questions</p>
    <div class="sugg" id="sugg"></div>
    <form id="f" autocomplete="off">
      <label for="q" style="position:absolute;left:-9999px">Your question</label>
      <input id="q" placeholder="Ask about experience, tools, availability…" maxlength="200">
      <button id="send" type="submit">Ask</button>
    </form>
    <p class="foot">Answers come from Sudheer's own CV and portfolio · Portfolio projects use demo data</p>
  </div>
</div>

function match(q){
  const n=" "+norm(q)+" ";let best=null,score=0;

function bubble(html,me){
  const m=document.createElement("div");m.className="msg"+(me?" me":"");
  if(!me){const av=document.createElement("div");av.className="av";const i=new Image();i.src=PHOTO;i.alt="";av.appendChild(i);m.appendChild(av)}
  const b=document.createElement("div");b.className="bub";b.innerHTML=html;m.appendChild(b);thread.appendChild(m);
  m.scrollIntoView({behavior:reduce?"auto":"smooth",block:"end"});return b;
}
function linksHtml(e){
  const parts=(e.l||[]).map(k=>`<a href="${L[k][1]}" target="_blank" rel="noopener">${L[k][0]} ↗</a>`);
  if(e.copy)parts.unshift(`<button type="button" data-copy="khattaksudheer@gmail.com">Copy email</button>`);
  return parts.length?`<div class="links">${parts.join("")}</div>`:"";
}
let busy=false;
function answer(e,userText){
  if(busy)return;busy=true;
  bubble(userText.replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c])),true);
  const b=bubble('<span class="typing" aria-label="typing"><span></span><span></span><span></span></span>',false);
  const html=e?e.a+linksHtml(e):`<p>I don't have a ready answer for that one. Try one of the popular questions below, or ask Sudheer directly.</p>`+linksHtml({l:["linkedin","wa"],copy:true});
  setTimeout(()=>{
    b.innerHTML=html;
    if(!reduce){b.style.opacity=0;b.style.transform="translateY(6px)";b.style.transition="opacity .35s,transform .35s";requestAnimationFrame(()=>{b.style.opacity=1;b.style.transform="none"})}
    b.parentElement.scrollIntoView({behavior:reduce?"auto":"smooth",block:"end"});busy=false;
  },reduce?100:650+Math.min(700,html.length*0.6));
}
thread.addEventListener("click",ev=>{const c=ev.target.closest("[data-copy]");if(!c)return;
  const t=c.dataset.copy;const done=()=>{c.textContent="Copied ✓";setTimeout(()=>c.textContent="Copy email",1600)};
  try{navigator.clipboard.writeText(t).then(done,()=>{const r=document.createRange();const el=document.getElementById("em");if(el){r.selectNodeContents(el);getSelection().removeAllRanges();getSelection().addRange(r)}})}catch(_){}});
const sugg=$("#sugg");
SUGG.forEach(id=>{const e=KB.find(x=>x.id===id);const bt=document.createElement("button");bt.type="button";bt.textContent=e.chip;bt.onclick=()=>answer(e,e.chip);sugg.appendChild(bt)});
$("#f").addEventListener("submit",ev=>{ev.preventDefault();const v=$("#q").value.trim();if(!v)return;$("#q").value="";answer(match(v),v)});
